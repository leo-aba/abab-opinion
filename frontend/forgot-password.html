<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 — AI Video Opinion Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page active login-page" id="page-login">
  <div class="solid-circle solid-circle-1"></div>
  <div class="solid-circle solid-circle-2"></div>
  <div class="solid-circle solid-circle-3"></div>
  <div class="solid-circle solid-circle-4"></div>

  <div class="login-container">
    <div class="login-hero">
      <div class="login-logo">
        <img src="logo.png" alt="Opinion AI Logo" width="40" height="40">
        AI Opinion Analytics
      </div>
      <h1><span>找回</span>密码</h1>
      <p class="subtitle" id="hero-subtitle">输入用户名，验证码将发送到注册邮箱。</p>
      <div class="login-features">
        <div class="login-feature">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>
          输入用户名匹配注册邮箱
        </div>
        <div class="login-feature">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>
          验证码 10 分钟内有效
        </div>
        <div class="login-feature">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>
          验证后直接设置新密码
        </div>
      </div>
    </div>

    <div class="login-card-wrapper">
      <!-- Step 1: Enter Username -->
      <div class="login-card" id="step-send">
        <h2>找回密码</h2>
        <p class="card-subtitle">输入您的用户名</p>
        <div id="step1-error" style="display:none;color:#ff4d4f;font-size:13px;margin-bottom:12px;padding:8px 12px;background:rgba(255,77,79,0.1);border-radius:6px;"></div>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="reset-username" placeholder="请输入您的用户名">
        </div>
        <div class="form-group">
          <label>注册邮箱</label>
          <input type="email" id="reset-email" placeholder="请输入注册邮箱">
        </div>
        <button class="btn-primary" id="send-btn" onclick="doSendCode()">发送验证码</button>
        <button class="btn-secondary" onclick="window.location.href='login.html'">返回登录</button>
      </div>

      <!-- Step 2: Verify Code + Reset Password -->
      <div class="login-card" id="step-reset" style="display:none;">
        <h2>重置密码</h2>
        <p class="card-subtitle">输入验证码和新密码</p>
        <div id="step2-error" style="display:none;color:#ff4d4f;font-size:13px;margin-bottom:12px;padding:8px 12px;background:rgba(255,77,79,0.1);border-radius:6px;"></div>
        <div id="step2-success" style="display:none;color:#52c41a;font-size:13px;margin-bottom:12px;padding:12px;background:rgba(82,196,26,0.1);border-radius:6px;"></div>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="verified-username" readonly style="background:#222;color:#BFB59E;cursor:not-allowed;">
        </div>
        <div class="form-group">
          <label>注册邮箱</label>
          <input type="text" id="verified-email" readonly style="background:#222;color:#BFB59E;cursor:not-allowed;">
        </div>
        <div class="form-group">
          <label>验证码</label>
          <input type="text" id="reset-code" placeholder="请输入 6 位验证码" maxlength="6" style="letter-spacing:4px;font-size:18px;text-align:center;">
        </div>
        <div class="form-group">
          <label>新密码</label>
          <input type="password" id="new-password" placeholder="请输入新密码（至少6位）">
        </div>
        <div class="form-group">
          <label>确认新密码</label>
          <input type="password" id="new-confirm" placeholder="请再次输入新密码">
        </div>
        <button class="btn-primary" id="reset-btn" onclick="doResetPassword()">重置密码</button>
        <button class="btn-secondary" onclick="backToSend()">← 返回上一步</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js?v=4"></script>
<script>
let currentUsername = '';

async function doSendCode() {
  const username = document.getElementById('reset-username').value.trim();
  const email = document.getElementById('reset-email').value.trim();
  const btn = document.getElementById('send-btn');
  const errEl = document.getElementById('step1-error');
  errEl.style.display = 'none';

  if (!username) {
    errEl.textContent = '请输入用户名';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '发送中...';

  try {
    const data = await api.sendResetCode(username, email);
    currentUsername = username;
    document.getElementById('verified-username').value = username;
    document.getElementById('verified-email').value = data.masked_email || '已验证';
    document.getElementById('step-send').style.display = 'none';
    document.getElementById('step-reset').style.display = 'block';
    document.getElementById('hero-subtitle').textContent = '验证码已发送到注册邮箱，请查收。';
  } catch (e) {
    errEl.textContent = e.message || '发送失败，请稍后重试';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '发送验证码';
  }
}

function backToSend() {
  document.getElementById('step-send').style.display = 'block';
  document.getElementById('step-reset').style.display = 'none';
  document.getElementById('hero-subtitle').textContent = '输入用户名，验证码将发送到注册邮箱。';
  document.getElementById('step2-error').style.display = 'none';
  document.getElementById('step2-success').style.display = 'none';
}

async function doResetPassword() {
  const code = document.getElementById('reset-code').value.trim();
  const password = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('new-confirm').value;
  const btn = document.getElementById('reset-btn');
  const errEl = document.getElementById('step2-error');
  const successEl = document.getElementById('step2-success');
  errEl.style.display = 'none';
  successEl.style.display = 'none';

  if (!code || code.length !== 6) {
    errEl.textContent = '请输入6位验证码';
    errEl.style.display = 'block';
    return;
  }
  if (!password || password.length < 6) {
    errEl.textContent = '密码至少需要6位';
    errEl.style.display = 'block';
    return;
  }
  if (password !== confirmPassword) {
    errEl.textContent = '两次输入的密码不一致';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '重置中...';

  try {
    await api.resetPassword(currentUsername, code, password, confirmPassword);
    successEl.innerHTML = '<strong>密码重置成功！</strong><br>请使用新密码登录。';
    successEl.style.display = 'block';
    document.getElementById('reset-code').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-confirm').value = '';
    setTimeout(function() { window.location.href = 'login.html'; }, 3000);
  } catch (e) {
    errEl.textContent = e.message || '重置失败，请重试';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '重置密码';
  }
}
</script>
</body>
</html>
