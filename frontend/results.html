<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Video Opinion Analytics — Analysis Results">
    <title>分析结果 — AI Video Opinion Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Toast 消息容器 -->
    <div id="toast-container"></div>

    <div class="page app-page active" id="page-app">

        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()" title="菜单">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <h2>分析结果</h2>
                </div>
                <div class="header-right" style="display:flex;gap:24px;align-items:center;">
                    <div class="stat-item">
                        <span class="stat-label">今日评论</span>
                        <span class="stat-value" id="stat-today-comments">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">新增视频</span>
                        <span class="stat-value" id="stat-new-videos">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">完成率</span>
                        <span class="stat-value" id="stat-completion">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">热门话题</span>
                        <span class="stat-value" id="stat-hot-topic">—</span>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="content-results">

                <!-- Loading State -->
                <div id="results-loading" style="display:flex;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-secondary-dark);">
                    <div style="text-align:center;">
                        <div style="font-size:32px;margin-bottom:12px;">&#9203;</div>
                        <p>加载中...</p>
                    </div>
                </div>

                <!-- Results Container (hidden until loaded) -->
                <div id="results-container" style="display:none;">

                <!-- Tracking Status Bar (hidden by default) -->
                <div class="tracking-info-bar" id="results-tracking-bar" style="display:none;">
                    <div class="tracking-info-left">
                        <div class="tracking-status-row">
                            <span class="tracking-live-dot"></span>
                            实时追踪中
                        </div>
                        <div class="tracking-info-item">
                            <span class="label">新增评论</span>
                            <span class="val" id="tracking-new">—</span>
                        </div>
                        <div class="tracking-info-item">
                            <span class="label">总评论</span>
                            <span class="val" id="tracking-total">—</span>
                        </div>
                        <div class="tracking-info-item">
                            <span class="label">剩余积分</span>
                            <span class="val" id="tracking-credits">—</span>
                        </div>
                        <div class="tracking-info-item">
                            <span class="label">运行时间</span>
                            <span class="val" id="tracking-elapsed">—</span>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <button class="btn-sm" onclick="location.reload()">刷新数据</button>
                        <button class="btn-danger-sm" id="btn-stop-tracking" onclick="stopTracking()">停止追踪</button>
                    </div>
                    <!-- Tracking Sentiment & Topics Row -->
                    <div class="tracking-detail-row" id="tracking-detail-row" style="display:none;width:100%;flex-wrap:wrap;gap:16px;margin-top:4px;border-top:1px solid #333;padding-top:12px;">
                        <div class="tracking-detail-item">
                            <span class="label">新增情感</span>
                            <span class="val" id="tracking-sentiment">—</span>
                        </div>
                        <div class="tracking-detail-item">
                            <span class="label">已分析</span>
                            <span class="val" id="tracking-analyzed">—</span>
                        </div>
                        <div class="tracking-sentiment-bar-wrap" style="flex:1;min-width:180px;">
                            <div class="tracking-sentiment-bar" id="tracking-sentiment-bar" style="display:none;height:6px;border-radius:3px;overflow:hidden;gap:2px;">
                                <span id="tracking-sent-pos" style="background:var(--cyan);height:100%;display:block;transition:width 0.5s;"></span>
                                <span id="tracking-sent-neg" style="background:var(--orange);height:100%;display:block;transition:width 0.5s;"></span>
                                <span id="tracking-sent-neu" style="background:#555;height:100%;display:block;transition:width 0.5s;"></span>
                            </div>
                        </div>
                        <div class="tracking-topics-mini" id="tracking-topics-mini" style="font-size:11px;color:var(--text-secondary);display:flex;gap:12px;flex-wrap:wrap;"></div>
                    </div>
                </div>

                <!-- Video Info Card -->
                <div class="video-info-card" id="video-info-card" style="display:none; background:var(--black); border-radius:var(--radius-lg); border:2px solid #333; padding:20px 24px; margin-bottom:20px;">
                    <div style="display:flex;gap:20px;align-items:flex-start;">
                        <div style="flex-shrink:0;width:140px;height:88px;border-radius:8px;overflow:hidden;background:#222;">
                            <img id="video-info-cover" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                                <span id="video-info-platform" style="background:var(--orange);color:var(--cream);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;">—</span>
                                <h3 id="video-info-title" style="color:var(--cream);font-size:16px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</h3>
                            </div>
                            <div style="display:flex;gap:20px;flex-wrap:wrap;color:#BFB59E;font-size:12px;margin-bottom:4px;">
                                <span>UP 主：<strong id="video-info-uploader" style="color:var(--cream);">—</strong></span>
                                <span>发布时间：<strong id="video-info-publish" style="color:var(--cream);">—</strong></span>
                            </div>
                            <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;">
                                <span style="font-size:12px;color:#BFB59E;">播放 <strong id="video-info-views" style="color:var(--cream);">—</strong></span>
                                <span style="font-size:12px;color:#BFB59E;">点赞 <strong id="video-info-likes" style="color:var(--cream);">—</strong></span>
                                <a id="video-info-link" href="#" target="_blank" style="font-size:12px;color:var(--orange);text-decoration:none;margin-left:auto;">查看原视频 →</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabs Navigation -->
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchResultTab(this, 'overview')">概览</button>
                    <button class="tab-btn" onclick="switchResultTab(this, 'topics')">Topic 聚类</button>
                    <button class="tab-btn" onclick="switchResultTab(this, 'sentiment')">属性情感</button>
                    <button class="tab-btn" onclick="switchResultTab(this, 'trends')">时间趋势</button>
                    <button class="tab-btn" onclick="switchResultTab(this, 'aisummary')">AI 总结</button>
                    <button class="tab-btn" onclick="switchResultTab(this, 'search')">评论检索</button>
                </div>

                <!-- Tab: Overview -->
                <div class="tab-panel active" id="tab-overview">
                    <div class="results-summary">
                        <div class="result-stat">
                            <div class="num" id="ov-total-comments">—</div>
                            <div class="lbl">评论总数</div>
                        </div>
                        <div class="result-stat">
                            <div class="num" id="ov-topic-count">—</div>
                            <div class="lbl">Topic 数量</div>
                        </div>
                        <div class="result-stat positive">
                            <div class="num" id="ov-positive-pct">—</div>
                            <div class="lbl">正面评价</div>
                        </div>
                        <div class="result-stat negative">
                            <div class="num" id="ov-negative-pct">—</div>
                            <div class="lbl">负面评价</div>
                        </div>
                        <div class="result-stat neutral">
                            <div class="num" id="ov-neutral-pct">—</div>
                            <div class="lbl">中性评价</div>
                        </div>
                    </div>

                    <button class="btn-send-report" id="send-report-btn" onclick="doSendReport()" title="发送分析摘要报告到注册邮箱">
                        <span class="btn-icon">📧</span>
                        <span class="btn-text">发送报告到邮箱</span>
                        <span class="spinner"></span>
                    </button>

                    <div class="chart-row">
                        <div class="chart-card">
                            <div class="chart-card-header">
                                <h3>评论趋势</h3>
                                <div class="search-tabs" id="overview-trend-tabs">
                                    <button class="search-tab active" onclick="switchOverviewTrendGranularity(this, 'day')">按天</button>
                                    <button class="search-tab" onclick="switchOverviewTrendGranularity(this, 'hour')">按小时</button>
                                </div>
                            </div>
                            <div class="chart-wrap">
                                <canvas id="resultsTrendChart"></canvas>
                            </div>
                        </div>
                        <div class="chart-card">
                            <div class="chart-card-header">
                                <h3>情绪分布</h3>
                                <span class="chart-badge">总体</span>
                            </div>
                            <div class="chart-wrap">
                                <canvas id="resultsPieChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Topics -->
                <div class="tab-panel" id="tab-topics">
                    <div class="topic-split">
                        <div class="topic-list-panel" id="topic-list">
                            <!-- populated by loadTopicsTab() -->
                        </div>
                        <div class="topic-detail-panel" id="topic-detail-panel">
                            <h3 id="topic-detail-name">—</h3>
                            <div class="topic-detail-meta" id="topic-detail-meta">—</div>
                            <div class="detail-section" id="topic-detail-comments-section">
                                <h4>代表评论</h4>
                                <div id="topic-detail-comments"></div>
                            </div>
                            <div class="detail-section" id="topic-detail-keywords-section">
                                <h4>关键词</h4>
                                <div class="keyword-tags" id="topic-detail-keywords"></div>
                            </div>
                            <div class="detail-section" id="topic-detail-ai-section">
                                <h4>AI 总结</h4>
                                <p id="topic-detail-ai-summary" style="font-size:13px;color:var(--text-secondary);line-height:1.7;">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Sentiment -->
                <div class="tab-panel" id="tab-sentiment">
                    <div id="sentiment-loading" style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-secondary-dark);">加载中...</div>
                    <div id="sentiment-content" style="display:none;">
                        <div class="chart-row-equal">
                            <div class="chart-card">
                                <div class="chart-card-header">
                                    <h3>属性情感分布</h3>
                                    <span class="chart-badge">多维度</span>
                                </div>
                                <div class="chart-wrap">
                                    <canvas id="sunburstChart"></canvas>
                                </div>
                            </div>
                            <div class="chart-card">
                                <div class="chart-card-header">
                                    <h3>正负面情感对比</h3>
                                    <span class="chart-badge">雷达图</span>
                                </div>
                                <div class="chart-wrap">
                                    <canvas id="radarChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Trends -->
                <div class="tab-panel" id="tab-trends">
                    <div class="chart-card">
                        <div class="chart-card-header">
                            <h3>时间趋势详情</h3>
                            <div class="search-tabs">
                                <button class="search-tab active" onclick="switchTrendGranularity(this, 'day')">按天</button>
                                <button class="search-tab" onclick="switchTrendGranularity(this, 'hour')">按小时</button>
                                <button class="search-tab" onclick="switchTrendGranularity(this, 'week')">按周</button>
                            </div>
                        </div>
                        <div class="chart-wrap" style="height:360px;">
                            <canvas id="trendsDetailChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Tab: AI Summary -->
                <div class="tab-panel" id="tab-aisummary">
                    <div id="aisummary-loading" style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-secondary-dark);">加载中...</div>
                    <div class="ai-summary-card" id="aisummary-content" style="display:none;">
                        <div class="ai-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            AI 自动总结
                        </div>
                        <h3 id="ai-summary-title">—</h3>
                        <p class="summary-text" id="ai-summary-text">—</p>
                        <div class="summary-highlights" id="ai-summary-highlights"></div>
                    </div>
                </div>

                <!-- Tab: Comment Search -->
                <div class="tab-panel" id="tab-search">
                    <div class="comment-search-box">
                        <input type="text" id="commentSearchInput" placeholder="搜索评论关键词..." onkeydown="if(event.key==='Enter')searchCommentsDebounced()">
                        <button class="btn btn-primary" style="width:auto;" onclick="searchCommentsDebounced()">搜索</button>
                    </div>
                    <p id="searchResultCount" style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">—</p>
                    <div class="comment-list" id="comment-list">
                        <!-- populated by searchComments() -->
                    </div>
                    <!-- Pagination -->
                    <div id="comment-pagination" style="display:none;justify-content:center;align-items:center;gap:8px;margin-top:16px;"></div>
                </div>

                </div><!-- end results-container -->

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/charts.js"></script>
    <script>
        // ============================================================
        // State
        // ============================================================
        var currentTaskId = null;           // 当前分析任务 ID
        var currentTopicsData = [];         // Topic 列表缓存
        var currentTrendGranularity = 'day'; // 趋势详情粒度
        var overviewTrendGranularity = 'day'; // 概览趋势图粒度
        var tabsLoaded = {};               // 标签页懒加载标记
        var commentSearchTimer = null;      // 评论搜索防抖定时器
        var resultsRefreshTimer = null;    // 追踪模式自动刷新定时器

        // ============================================================
        // 初始化 — 从 URL 取 task_id，加载概览
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            loadSidebar('history');
            initPage({ loadUser: true, loadHeaderStats: true });

            var params = new URLSearchParams(window.location.search);
            currentTaskId = params.get('task_id');
            if (!currentTaskId) {
                document.getElementById('results-loading').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-secondary-dark);"><div style="font-size:40px;margin-bottom:12px;">📋</div><p style="font-size:15px;font-weight:500;">缺少 task_id 参数</p><p style="font-size:13px;margin-top:4px;">请从 <a href="history.html" style="color:var(--orange);">历史记录</a> 中选择一条任务查看结果。</p></div>';
                return;
            }
            loadOverview();

            // 追踪模式下每 10 秒自动刷新概览数据
            resultsRefreshTimer = setInterval(refreshIfTracking, 10000);
        });

        // 页面离开时清理定时器
        window.addEventListener('beforeunload', function() {
            if (resultsRefreshTimer) clearInterval(resultsRefreshTimer);
        });

        // ============================================================
        // Toast 消息
        // ============================================================
        /**
         * 显示一个自动消失的 Toast 消息
         * @param {string} message - 消息文本
         * @param {'success'|'error'|'info'} type - 消息类型
         */
        function showToast(message, type) {
            type = type || 'info';
            var icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : 'ℹ️');
            var container = document.getElementById('toast-container');
            var el = document.createElement('div');
            el.className = 'toast-msg ' + type;
            el.innerHTML = '<span class="toast-icon">' + icon + '</span><span class="toast-text">' + message + '</span>';
            container.appendChild(el);
            // 3 秒后移除
            setTimeout(function() {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 3000);
        }

        /** 发送分析报告到注册邮箱 */
        async function doSendReport() {
            if (!currentTaskId) return;
            var btn = document.getElementById('send-report-btn');
            var btnText = btn.querySelector('.btn-text');
            btn.disabled = true;
            btn.classList.add('loading');
            btnText.textContent = '发送中...';
            try {
                await api.sendReport(currentTaskId);
                showToast('报告已发送至您的注册邮箱', 'success');
            } catch (e) {
                showToast(e.message || '发送失败，请稍后重试', 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                btnText.textContent = '发送报告到邮箱';
            }
        }

        // ============================================================
        // 概览标签页
        // ============================================================
        /** 加载概览数据：统计卡片 + 趋势图 + 情绪饼图 + 追踪状态 */
        async function loadOverview() {
            if (!currentTaskId) return;
            try {
                var overview = await api.getResultsOverview(currentTaskId);
                // 填充视频信息卡片
                var vidCard = document.getElementById('video-info-card');
                if (vidCard) vidCard.style.display = '';
                setText('video-info-title', overview.video_title || '—');
                setAttr('video-info-cover', 'src', overview.video_cover || '');
                // 封面显示逻辑：有 src 就显示，加载失败自动隐藏
                var coverImg = document.getElementById('video-info-cover');
                if (coverImg) {
                    if (overview.video_cover) {
                        coverImg.style.display = '';
                        coverImg.onerror = function() { this.style.display = 'none'; };
                    } else {
                        coverImg.style.display = 'none';
                    }
                }
                setText('video-info-uploader', overview.video_uploader || '—');
                setText('video-info-platform', overview.video_platform === 'bilibili' ? 'B站' : (overview.video_platform || '—'));
                setText('video-info-views', formatCount(overview.video_view_count));
                setText('video-info-likes', formatCount(overview.video_like_count));
                setText('video-info-publish', overview.video_publish_time || '—');
                if (overview.video_url) {
                    setAttr('video-info-link', 'href', overview.video_url);
                }

                // 填充统计卡片
                setText('ov-total-comments', (overview.total_comments || 0).toLocaleString());
                setText('ov-topic-count', (overview.topic_count || 0).toString());
                setText('ov-positive-pct', (overview.positive_pct || 0) + '%');
                setText('ov-negative-pct', (overview.negative_pct || 0) + '%');
                setText('ov-neutral-pct', (overview.neutral_pct || 0) + '%');

                // 加载趋势图和情绪饼图
                var trendData = await api.getResultsTrend(currentTaskId, overviewTrendGranularity);
                renderResultsTrend(trendData);

                var sentimentData = await api.getResultsSentimentRatio(currentTaskId);
                renderResultsPie(sentimentData);

                // 加载追踪状态条
                loadTrackingStatus();

                // 隐藏 loading，显示内容
                document.getElementById('results-loading').style.display = 'none';
                document.getElementById('results-container').style.display = '';
            } catch (e) {
                console.error('loadOverview error:', e);
                showError('results-loading', '加载概览数据失败: ' + (e.message || '未知错误'));
            }
        }

        // ============================================================
        // 追踪状态条
        // ============================================================
        var currentTrackingId = null;  // 追踪任务 ID（从 tracking-status 获取）

        /** 加载追踪状态条（结果页顶部） */
        async function loadTrackingStatus() {
            if (!currentTaskId) return;
            try {
                var status = await api.getResultsTrackingStatus(currentTaskId);
                if (status && status.is_tracking) {
                    currentTrackingId = status.tracking_id;
                    var bar = document.getElementById('results-tracking-bar');
                    if (bar) bar.style.display = '';
                    setText('tracking-new', '+' + (status.new_comments || 0).toLocaleString());
                    setText('tracking-total', (status.total_comments || 0).toLocaleString());
                    setText('tracking-credits', (status.credits_remaining || 0).toLocaleString());
                    setText('tracking-elapsed', status.duration_formatted || formatDuration(status.duration_seconds || 0));

                    // 渲染新增评论情感和话题分布
                    renderTrackingDetail(status);
                } else {
                    currentTrackingId = null;
                    var bar = document.getElementById('results-tracking-bar');
                    if (bar) bar.style.display = 'none';
                }
            } catch (e) {
                console.error('loadTrackingStatus error:', e);
            }
        }

        /** 渲染追踪详细数据：情感条 + 话题分布 */
        function renderTrackingDetail(status) {
            var sent = status.new_comments_sentiment || {};
            var pos = sent.positive || 0;
            var neg = sent.negative || 0;
            var neu = sent.neutral || 0;
            var total = pos + neg + neu;

            var detailRow = document.getElementById('tracking-detail-row');
            if (total > 0 && detailRow) {
                detailRow.style.display = '';
                setText('tracking-sentiment', pos + ' 正面 / ' + neg + ' 负面 / ' + neu + ' 中性');
                setText('tracking-analyzed', (status.analyzed_comments || 0).toLocaleString() + ' / ' + (status.new_comments || 0).toLocaleString());

                // 渲染三色比例条
                var bar = document.getElementById('tracking-sentiment-bar');
                if (bar) {
                    bar.style.display = 'flex';
                    document.getElementById('tracking-sent-pos').style.width = (pos / total * 100).toFixed(1) + '%';
                    document.getElementById('tracking-sent-neg').style.width = (neg / total * 100).toFixed(1) + '%';
                    document.getElementById('tracking-sent-neu').style.width = (neu / total * 100).toFixed(1) + '%';
                }

                // 渲染话题分布
                var topics = status.new_comments_topics || [];
                var miniEl = document.getElementById('tracking-topics-mini');
                if (miniEl && topics.length > 0) {
                    var html = '<span style="font-weight:600;color:var(--cream);">话题分布</span> ';
                    topics.slice(0, 5).forEach(function(t) {
                        html += '<span style="background:#1A1A1A;padding:2px 8px;border-radius:10px;border:1px solid #333;">' +
                            escapeHtml(t.topic_name) + ' +' + (t.count || 0) +
                            '</span>';
                    });
                    miniEl.innerHTML = html;
                }
            } else if (detailRow) {
                detailRow.style.display = 'none';
            }
        }

        /** 停止追踪并隐藏状态条 */
        function stopTracking() {
            var tid = currentTrackingId || currentTaskId;
            if (!tid) return;
            api.stopTracking(tid).then(function() {
                var bar = document.getElementById('results-tracking-bar');
                if (bar) bar.style.display = 'none';
                currentTrackingId = null;
                if (resultsRefreshTimer) clearInterval(resultsRefreshTimer);
            }).catch(function(e) {
                console.error('stopTracking error:', e);
            });
        }

        /** 追踪模式下自动刷新概览数据（趋势图+统计卡片+追踪状态条） */
        async function refreshIfTracking() {
            if (!currentTaskId) return;
            try {
                var status = await api.getResultsTrackingStatus(currentTaskId);
                if (!status || !status.is_tracking) return;  // 非追踪模式，不刷新

                // 刷新统计卡片
                var overview = await api.getResultsOverview(currentTaskId);
                setText('ov-total-comments', (overview.total_comments || 0).toLocaleString());
                setText('ov-topic-count', (overview.topic_count || 0).toString());
                setText('ov-positive-pct', (overview.positive_pct || 0) + '%');
                setText('ov-negative-pct', (overview.negative_pct || 0) + '%');
                setText('ov-neutral-pct', (overview.neutral_pct || 0) + '%');

                // 刷新趋势图
                var trendData = await api.getResultsTrend(currentTaskId, overviewTrendGranularity);
                renderResultsTrend(trendData);

                // 刷新追踪状态条
                currentTrackingId = status.tracking_id;
                var bar = document.getElementById('results-tracking-bar');
                if (bar) bar.style.display = '';
                setText('tracking-new', '+' + (status.new_comments || 0).toLocaleString());
                setText('tracking-total', (status.total_comments || 0).toLocaleString());
                setText('tracking-credits', (status.credits_remaining || 0).toLocaleString());
                setText('tracking-elapsed', status.duration_formatted || formatDuration(status.duration_seconds || 0));
                // 刷新情感条和话题分布
                renderTrackingDetail(status);
            } catch (e) {
                console.error('refreshIfTracking error:', e);
            }
        }

        // ============================================================
        // 标签页切换（懒加载）
        // ============================================================
        /** 切换到指定标签页，首次进入时触发懒加载 */
        function switchResultTab(btn, tabName) {
            document.querySelectorAll('#content-results .tab-btn').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            document.querySelectorAll('#content-results .tab-panel').forEach(function(p) { p.classList.remove('active'); });
            var panel = document.getElementById('tab-' + tabName);
            if (panel) panel.classList.add('active');

            // 标签页懒加载：首次访问时拉取数据并缓存
            switch (tabName) {
                case 'overview':    if (!tabsLoaded['overview']) { tabsLoaded['overview'] = true; } break;
                case 'topics':      if (!tabsLoaded['topics']) { tabsLoaded['topics'] = true; loadTopicsTab(); } break;
                case 'sentiment':   if (!tabsLoaded['sentiment']) { tabsLoaded['sentiment'] = true; loadSentimentTab(); } break;
                case 'trends':      if (!tabsLoaded['trends']) { tabsLoaded['trends'] = true; loadTrendsTab(); } break;
                case 'aisummary':   if (!tabsLoaded['aisummary']) { tabsLoaded['aisummary'] = true; loadAISummaryTab(); } break;
                case 'search':      if (!tabsLoaded['search']) { tabsLoaded['search'] = true; loadSearchTab(); } break;
            }
        }

        // ============================================================
        // Topic 聚类标签页
        // ============================================================
        /** 加载 Topic 列表并自动选中第一个 */
        async function loadTopicsTab() {
            if (!currentTaskId) return;
            var container = document.getElementById('topic-list');
            showLoading('topic-list');
            try {
                var topics = await api.getResultsTopics(currentTaskId);
                currentTopicsData = topics || [];
                if (!currentTopicsData.length) {
                    showEmpty('topic-list', '暂无 Topic 数据', '📭');
                    return;
                }
                var html = '';
                currentTopicsData.forEach(function(t, idx) {
                    html += '<div class="topic-list-item' + (idx === 0 ? ' active' : '') + '" onclick="showTopicDetail(this, \'' + escapeHtml(t.topic_name) + '\')">' +
                        '<span class="topic-name">' + escapeHtml(t.topic_name) + '</span>' +
                        '<span class="topic-count">' + (t.comment_count || 0).toLocaleString() + '</span>' +
                        '</div>';
                });
                container.innerHTML = html;
                // 自动选中第一个 Topic
                if (currentTopicsData.length > 0) {
                    showTopicDetail(container.querySelector('.topic-list-item'), currentTopicsData[0].topic_name);
                }
            } catch (e) {
                console.error('loadTopicsTab error:', e);
                showError('topic-list', '加载话题列表失败');
            }
        }

        /** 加载并展示单个 Topic 详情（代表评论 + 关键词 + AI 总结） */
        async function showTopicDetail(el, topicName) {
            if (!currentTaskId) return;
            // 高亮当前选中项
            var items = document.querySelectorAll('#topic-list .topic-list-item');
            items.forEach(function(t) { t.classList.remove('active'); });
            if (el) el.classList.add('active');

            // 详情面板显示 loading
            var panel = document.getElementById('topic-detail-panel');
            setText('topic-detail-name', topicName);
            setText('topic-detail-meta', '加载中...');
            document.getElementById('topic-detail-comments').innerHTML = '';
            document.getElementById('topic-detail-keywords').innerHTML = '';
            setText('topic-detail-ai-summary', '—');

            try {
                var detail = await api.getResultsTopicDetail(currentTaskId, topicName);
                setText('topic-detail-name', detail.topic_name || topicName);
                setText('topic-detail-meta', (detail.comment_count || 0).toLocaleString() + ' 条相关评论 | 占比 ' + (detail.percentage || '0') + '%');

                // 代表评论
                var commentsHtml = '';
                if (detail.sample_comments && detail.sample_comments.length) {
                    detail.sample_comments.forEach(function(c) {
                        commentsHtml += '<div class="comment-example">"' + escapeHtml(c) + '"</div>';
                    });
                } else {
                    commentsHtml = '<div class="comment-example">暂无代表评论</div>';
                }
                document.getElementById('topic-detail-comments').innerHTML = commentsHtml;

                // 关键词
                var kwHtml = '';
                if (detail.keywords && detail.keywords.length) {
                    detail.keywords.forEach(function(k) {
                        kwHtml += '<span class="keyword-tag">' + escapeHtml(k) + '</span>';
                    });
                } else {
                    kwHtml = '<span class="keyword-tag">暂无关键词</span>';
                }
                document.getElementById('topic-detail-keywords').innerHTML = kwHtml;

                // AI 总结
                setText('topic-detail-ai-summary', detail.ai_summary || '暂无AI总结');
            } catch (e) {
                console.error('showTopicDetail error:', e);
                setText('topic-detail-meta', '加载失败');
                setText('topic-detail-ai-summary', '加载失败: ' + (e.message || '未知错误'));
            }
        }

        // ============================================================
        // 属性情感标签页
        // ============================================================
        /** 加载属性情感数据并渲染旭日图 + 雷达图 */
        async function loadSentimentTab() {
            if (!currentTaskId) return;
            try {
                var data = await api.getResultsSentimentAttribute(currentTaskId);
                document.getElementById('sentiment-loading').style.display = 'none';
                document.getElementById('sentiment-content').style.display = '';
                if (data.sunburst && data.sunburst.length) {
                    renderSunburst(data.sunburst);
                }
                if (data.radar) {
                    renderRadar(data.radar);
                }
            } catch (e) {
                console.error('loadSentimentTab error:', e);
                setText('sentiment-loading', '加载失败: ' + (e.message || '未知错误'));
            }
        }

        // ============================================================
        // 时间趋势标签页
        // ============================================================
        /** 加载时间趋势数据 */
        async function loadTrendsTab() {
            if (!currentTaskId) return;
            await loadTrendsDetail(currentTrendGranularity);
        }

        /** 按指定粒度加载并渲染趋势详情 */
        async function loadTrendsDetail(granularity) {
            if (!currentTaskId) return;
            try {
                var data = await api.getResultsTrendsDetail(currentTaskId, granularity);
                renderTrendsDetail(data);
            } catch (e) {
                console.error('loadTrendsDetail error:', e);
            }
        }

        /** 切换概览趋势图粒度（天/小时）并重新加载 */
        function switchOverviewTrendGranularity(btn, granularity) {
            document.querySelectorAll('#overview-trend-tabs .search-tab').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            overviewTrendGranularity = granularity;
            if (!currentTaskId) return;
            api.getResultsTrend(currentTaskId, granularity).then(function(trendData) {
                renderResultsTrend(trendData);
            }).catch(function(e) {
                console.error('switchOverviewTrendGranularity error:', e);
            });
        }

        /** 切换趋势粒度（日/小时/周）并重新加载 */
        function switchTrendGranularity(btn, granularity) {
            document.querySelectorAll('#tab-trends .search-tab').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            currentTrendGranularity = granularity;
            loadTrendsDetail(granularity);
        }

        // ============================================================
        // AI 总结标签页
        // ============================================================
        /** 加载 AI 总结报告 */
        async function loadAISummaryTab() {
            if (!currentTaskId) return;
            try {
                var data = await api.getResultsAISummary(currentTaskId);
                document.getElementById('aisummary-loading').style.display = 'none';
                document.getElementById('aisummary-content').style.display = '';
                setText('ai-summary-title', data.title || '—');
                setText('ai-summary-text', data.summary_text || '—');

                var highlightsHtml = '';
                if (data.highlights && data.highlights.length) {
                    data.highlights.forEach(function(h) {
                        highlightsHtml += '<div class="highlight-item">' +
                            '<div class="hl-label">' + escapeHtml(h.label) + '</div>' +
                            '<div class="hl-text">' + escapeHtml(h.text) + '</div>' +
                            '</div>';
                    });
                }
                setHTML('ai-summary-highlights', highlightsHtml);
            } catch (e) {
                console.error('loadAISummaryTab error:', e);
                setText('aisummary-loading', '加载失败: ' + (e.message || '未知错误'));
            }
        }

        // ============================================================
        // 评论检索标签页
        // ============================================================
        /** 初始化评论检索 */
        function loadSearchTab() {
            if (!currentTaskId) return;
            searchComments();
        }

        /** 评论搜索防抖（300ms） */
        function searchCommentsDebounced() {
            if (commentSearchTimer) clearTimeout(commentSearchTimer);
            commentSearchTimer = setTimeout(function() { searchComments(); }, 300);
        }

        /** 按关键词搜索评论（支持分页） */
        async function searchComments(page) {
            if (!currentTaskId) return;
            var keyword = document.getElementById('commentSearchInput').value.trim();
            page = page || 1;
            var pageSize = 20;

            showLoading('comment-list');
            try {
                var result = await api.searchComments(currentTaskId, keyword, page, pageSize);
                setText('searchResultCount', '共 ' + (result.total || 0) + ' 条评论' + (keyword ? '（关键词: ' + keyword + '）' : '') + '，第 ' + page + ' 页');

                var html = '';
                if (result.items && result.items.length) {
                    result.items.forEach(function(item) {
                        var textHtml = item.highlighted_text || escapeHtml(item.text || '');
                        html += '<div class="comment-item">' +
                            '<div class="comment-text">' + textHtml + '</div>' +
                            '<div class="comment-meta">' +
                            '<span>' + escapeHtml(item.platform || '') + '用户 · ' + escapeHtml(item.time_ago || '') + '</span>' +
                            (item.topic ? '<span class="comment-topic-badge">' + escapeHtml(item.topic) + '</span>' : '') +
                            (item.likes ? '<span>❤ ' + item.likes + '</span>' : '') +
                            '</div>' +
                            '</div>';
                    });
                } else {
                    html = '<div style="padding:40px;text-align:center;color:var(--text-secondary-dark);">暂无评论数据</div>';
                }
                setHTML('comment-list', html);

                // 分页控件
                var totalPages = Math.ceil((result.total || 0) / pageSize);
                var pagHtml = '';
                if (totalPages > 1) {
                    pagHtml += '<button class="btn-sm" onclick="searchComments(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>';
                    pagHtml += '<span style="color:var(--text-secondary);font-size:13px;">' + page + ' / ' + totalPages + '</span>';
                    pagHtml += '<button class="btn-sm" onclick="searchComments(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>下一页</button>';
                }
                document.getElementById('comment-pagination').style.display = totalPages > 1 ? '' : 'none';
                setHTML('comment-pagination', pagHtml);
            } catch (e) {
                console.error('searchComments error:', e);
                showError('comment-list', '搜索评论失败: ' + (e.message || '未知错误'));
            }
        }

        // ============================================================
        // 工具函数
        // ============================================================
        /** 防 XSS 的 HTML 转义 */
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
