<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时追踪 — AI Video Opinion Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar-container"></div>

<!-- Main Content -->
<main class="main-content">
    <!-- Header -->
    <header class="top-header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" title="菜单">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div>
                <h2>实时追踪</h2>
                <div class="greeting">管理正在运行的实时追踪任务</div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <div class="page-content active" id="content-tracking">
        <div id="tracking-tasks-container">
            <div style="text-align:center;padding:60px 20px;color:var(--text-secondary-dark);" id="tracking-empty" >
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;color:#9CA3AF;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/></svg>
                <p style="font-size:15px;font-weight:500;">暂无实时追踪任务</p>
                <p style="font-size:13px;margin-top:4px;">在「创建分析」中选择「实时追踪」模式来启动一个追踪任务</p>
                <a href="create-analysis.html" class="btn" style="background:var(--orange);color:var(--cream);margin-top:16px;padding:10px 24px;display:inline-block;">+ 创建分析</a>
            </div>
            <div id="tracking-tasks-list"></div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
/** 加载并渲染追踪任务列表 */
async function loadTrackingTasks() {
    const empty = document.getElementById('tracking-empty');
    const list = document.getElementById('tracking-tasks-list');

    try {
        const tasks = await api.getTrackingTasks();

        if (!tasks || tasks.length === 0) {
            empty.style.display = 'block';
            list.innerHTML = '';
            return;
        }

        empty.style.display = 'none';

        let html = '';
        for (const t of tasks) {
            html += `
            <div class="chart-card" style="margin-bottom:20px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div class="tracking-status-row">${t.status === 'active' ? '<span class="tracking-live-dot"></span>追踪中' : '<span style="color:var(--text-secondary);">已停止</span>'}</div>
                        <h3 style="font-size:16px;font-weight:600;">${escapeHtml(t.video_title)}</h3>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <a href="results.html?task_id=${encodeURIComponent(t.task_id)}" class="btn-sm" style="background:var(--orange);color:var(--cream);">查看结果</a>
                        <button class="btn-danger-sm" onclick="stopTracking('${t.tracking_id}')">停止追踪</button>
                    </div>
                </div>
                <div class="video-card-meta" style="margin-bottom:16px;">
                    <span>${getPlatformLabel(t.platform)} · ${escapeHtml(t.author)}</span>
                    <span>分析完成时间: ${t.analysis_finished_at || '—'}</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">
                    <div style="background:var(--bg);padding:16px;border-radius:8px;text-align:center;">
                        <div style="font-size:24px;font-weight:800;color:var(--green);">+${(t.new_comments || 0).toLocaleString()}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">新增评论</div>
                    </div>
                    <div style="background:var(--bg);padding:16px;border-radius:8px;text-align:center;">
                        <div style="font-size:24px;font-weight:800;color:var(--accent);">${(t.credits_remaining || 0).toLocaleString()}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">剩余积分</div>
                    </div>
                </div>
            </div>`;
        }
        list.innerHTML = html;
    } catch (e) {
        console.error('loadTrackingTasks error:', e);
        showError('tracking-tasks-list', '加载追踪任务失败，请重试');
        empty.style.display = 'block';
    }
}

/** 停止指定追踪任务并刷新列表 */
async function stopTracking(trackingId) {
    if (!trackingId) {
        console.error('stopTracking: trackingId is empty');
        return;
    }
    try {
        const result = await api.stopTracking(trackingId);
        console.log('追踪已停止:', result);
        await loadTrackingTasks();
    } catch (e) {
        console.error('stopTracking error:', e);
        alert('停止追踪失败：' + (e.message || '未知错误'));
    }
}

/** 平台枚举 → 中文标签 */
function getPlatformLabel(platform) {
    if (platform === 'bilibili') return 'Bilibili';
    if (platform === 'douyin') return '抖音';
    return platform || '未知平台';
}

/** 防 XSS 的 HTML 转义 */
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 初始化：加载用户信息后获取追踪任务
let trackingPollTimer = null;
loadSidebar('tracking');
initPage().then(() => {
    loadTrackingTasks();
    // 每 5 秒自动刷新追踪任务列表
    trackingPollTimer = setInterval(loadTrackingTasks, 5000);
});

// 页面离开时清理定时器
window.addEventListener('beforeunload', () => {
    if (trackingPollTimer) clearInterval(trackingPollTimer);
});
</script>
</body>
</html>
