<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Video Opinion Analytics Settings">
    <title>系统设置 — AI Video Opinion Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 确认弹窗 — 浅色系 */
        .confirm-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.15); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .confirm-dialog {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px; padding: 32px 28px 24px;
            width: 420px; max-width: 92vw;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
        }
        .confirm-dialog h3 {
            margin: 0 0 24px; font-size: 18px; font-weight: 600;
            color: #1f2937;
        }
        .confirm-dialog .form-group { margin-bottom: 16px; }
        .confirm-dialog .form-group:last-of-type { margin-bottom: 0; }
        .confirm-dialog .form-group label {
            display: block; font-size: 13px; font-weight: 500;
            color: #6b7280; margin-bottom: 6px;
        }
        .confirm-dialog .form-group input {
            width: 100%; padding: 10px 14px;
            border: 1px solid #d1d5db; border-radius: 8px;
            background: #f9fafb; color: #1f2937; font-size: 14px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .confirm-dialog .form-group input:focus {
            outline: none; border-color: #6366f1;
            background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .confirm-buttons {
            display: flex; gap: 12px; margin-top: 24px;
        }
        .confirm-buttons button {
            flex: 1; font-size: 14px; padding: 10px 0;
            border-radius: 8px; font-weight: 500;
            text-align: center; cursor: pointer;
            transition: all 0.2s;
        }
        .confirm-btn-cancel {
            background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
        }
        .confirm-btn-cancel:hover { background: #e5e7eb; }
        .confirm-btn-submit {
            background: #6366f1; color: #fff; border: none;
        }
        .confirm-btn-submit:hover { background: #4f46e5; }
        .confirm-btn-submit:disabled {
            opacity: 0.6; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="page app-page active" id="page-app">

        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()" title="菜单">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div>
                        <h2>系统设置</h2>
                        <div class="greeting">管理系统配置与偏好</div>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="header-stat"><div class="val" id="stat-today-comments">—</div><div class="lbl">今日评论</div></div>
                    <div class="header-stat"><div class="val" id="stat-new-videos">—</div><div class="lbl">新增视频</div></div>
                    <div class="header-stat"><div class="val" id="stat-completion">—</div><div class="lbl">分析完成</div></div>
                    <div class="header-stat"><div class="val" id="stat-hot-topic">—</div><div class="lbl">最近热点</div></div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content active" id="content-settings">
                <div class="settings-section">
                    <h3>分析偏好</h3>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">默认评论数量</div>
                            <div class="setting-desc">新建分析时的默认评论抓取量</div>
                        </div>
                        <select id="setting-default-comment-count" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;" onchange="onDefaultCommentCountChange()">
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                            <option value="5000">5000</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">自动生成 AI 总结</div>
                            <div class="setting-desc">分析完成后自动调用大模型生成总结报告</div>
                        </div>
                        <div class="toggle-switch" id="toggle-auto-ai-summary" onclick="onToggleAutoAiSummary()"></div>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>通知设置</h3>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">分析完成通知</div>
                            <div class="setting-desc">分析完成后通过邮件/站内信通知</div>
                        </div>
                        <div class="toggle-switch" id="toggle-analysis-complete-notify" onclick="onToggleAnalysisCompleteNotify()"></div>
                    </div>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">异常预警</div>
                            <div class="setting-desc">当负面情绪突增时发送预警通知</div>
                        </div>
                        <div class="toggle-switch" id="toggle-anomaly-alert" onclick="onToggleAnomalyAlert()"></div>
                    </div>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">追踪报告频率</div>
                            <div class="setting-desc">实时追踪中每隔多久发送一次分析报告邮件</div>
                        </div>
                        <select id="setting-report-interval" onchange="onReportIntervalChange()" style="padding:8px 12px;border:2px solid #FF7A22;border-radius:10px;background:#000;color:#F8F2E4;font-size:13px;cursor:pointer;">
                            <option value="15">每 15 分钟</option>
                            <option value="30">每 30 分钟</option>
                            <option value="60">每 1 小时</option>
                            <option value="120">每 2 小时</option>
                            <option value="240">每 4 小时</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>账户信息</h3>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">用户名</div>
                            <div class="setting-desc" id="setting-username-value">—</div>
                        </div>
                        <button class="btn-outline" style="font-size:12px;padding:6px 14px;" onclick="onEditUsername()">修改</button>
                    </div>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">邮箱</div>
                            <div class="setting-desc" id="setting-email-value">—</div>
                        </div>
                        <button class="btn-outline" style="font-size:12px;padding:6px 14px;" onclick="onEditEmail()">修改</button>
                    </div>
                    <div class="setting-row">
                        <div>
                            <div class="setting-label">密码</div>
                            <div class="setting-desc">••••••••</div>
                        </div>
                        <button class="btn-outline" style="font-size:12px;padding:6px 14px;" onclick="onEditPassword()">修改</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 确认弹窗 -->
    <div class="confirm-overlay" id="confirm-overlay" style="display:none;" onclick="closeConfirmDialog()">
        <div class="confirm-dialog" onclick="event.stopPropagation()">
            <h3 id="confirm-title">确认操作</h3>
            <div id="confirm-fields"></div>
            <div id="confirm-error" style="display:none; color:#ff4d4f; font-size:13px; margin-bottom:12px; padding:8px 12px; background:rgba(255,77,79,0.1); border-radius:6px;"></div>
            <div class="confirm-buttons">
                <button class="confirm-btn-cancel" onclick="closeConfirmDialog()">取消</button>
                <button class="confirm-btn-submit" id="confirm-submit-btn">确认</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
let currentSettings = null;

/** 设置按钮 loading 状态 */
function setButtonLoading(btn, loading) {
    if (loading) {
        btn.disabled = true;
        btn.dataset.originalText = btn.textContent;
        btn.textContent = '处理中...';
        btn.style.pointerEvents = 'none';
    } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.originalText || btn.textContent;
        btn.style.pointerEvents = 'auto';
    }
}

/** 加载所有设置项并填充到表单 */
async function loadSettings() {
    try {
        currentSettings = await api.getSettings();

        // 分析偏好
        if (currentSettings.analysis_preferences) {
            const ap = currentSettings.analysis_preferences;
            const countSelect = document.getElementById('setting-default-comment-count');
            if (ap.default_comment_count) {
                countSelect.value = ap.default_comment_count;
            }
            setToggleState('toggle-auto-ai-summary', ap.auto_ai_summary);
        }

        // 通知偏好
        if (currentSettings.notification_preferences) {
            const np = currentSettings.notification_preferences;
            setToggleState('toggle-analysis-complete-notify', np.analysis_complete_notify);
            setToggleState('toggle-anomaly-alert', np.anomaly_alert);
            const sel = document.getElementById('setting-report-interval');
            if (sel) sel.value = np.report_interval_minutes ?? 30;
        }

        // 账户信息
        if (currentSettings.account) {
            const acct = currentSettings.account;
            setText('setting-username-value', acct.username || '—');
            setText('setting-email-value', acct.email || '—');
        }
    } catch (e) {
        console.error('loadSettings error:', e);
        alert('加载设置失败：' + (e.message || '未知错误'));
    }
}

/** 设置开关组件的 on/off 状态 */
function setToggleState(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) {
        el.classList.add('on');
    } else {
        el.classList.remove('on');
    }
}

// ---- 分析偏好变更处理 ----

/** 默认评论数量下拉变更 → 保存 */
async function onDefaultCommentCountChange() {
    const val = parseInt(document.getElementById('setting-default-comment-count').value);
    try {
        await api.updateAnalysisPreferences({ default_comment_count: val });
    } catch (e) {
        console.error('update analysis preferences error:', e);
        alert('保存失败：' + (e.message || '未知错误'));
        await loadSettings();
    }
}

/** 自动 AI 总结开关 → 保存 */
async function onToggleAutoAiSummary() {
    const el = document.getElementById('toggle-auto-ai-summary');
    const newVal = !el.classList.contains('on');
    el.classList.toggle('on');
    try {
        await api.updateAnalysisPreferences({ auto_ai_summary: newVal });
    } catch (e) {
        console.error('update auto_ai_summary error:', e);
        alert('保存失败：' + (e.message || '未知错误'));
        await loadSettings();
    }
}

// ---- 通知偏好变更处理 ----

/** 分析完成通知开关 → 保存 */
async function onToggleAnalysisCompleteNotify() {
    const el = document.getElementById('toggle-analysis-complete-notify');
    const newVal = !el.classList.contains('on');
    el.classList.toggle('on');
    try {
        await api.updateNotificationPreferences({ analysis_complete_notify: newVal });
    } catch (e) {
        console.error('update analysis_complete_notify error:', e);
        alert('保存失败：' + (e.message || '未知错误'));
        await loadSettings();
    }
}

/** 异常预警通知开关 → 保存 */
async function onToggleAnomalyAlert() {
    const el = document.getElementById('toggle-anomaly-alert');
    const newVal = !el.classList.contains('on');
    el.classList.toggle('on');
    try {
        await api.updateNotificationPreferences({ anomaly_alert: newVal });
    } catch (e) {
        console.error('update anomaly_alert error:', e);
        alert('保存失败：' + (e.message || '未知错误'));
        await loadSettings();
    }
}

/** 追踪报告频率下拉变更 → 保存 */
async function onReportIntervalChange() {
    const sel = document.getElementById('setting-report-interval');
    const val = parseInt(sel.value);
    try {
        await api.updateNotificationPreferences({ report_interval_minutes: val });
    } catch (e) {
        console.error('update report_interval_minutes error:', e);
        alert('保存失败：' + (e.message || '未知错误'));
        await loadSettings();
    }
}

// ---- 账户信息变更处理 ----

let _confirmCallback = null;

/** 打开确认弹窗 */
function openConfirmDialog(title, fields, onConfirm) {
    document.getElementById('confirm-title').textContent = title;
    const container = document.getElementById('confirm-fields');
    let html = '';
    fields.forEach(f => {
        html += '<div class="form-group" style="margin-bottom:12px;">';
        html += '<label>' + f.label + '</label>';
        html += '<input type="' + (f.type || 'text') + '" id="confirm-field-' + f.id + '" placeholder="' + (f.placeholder || '') + '" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-primary);font-size:14px;">';
        html += '</div>';
    });
    container.innerHTML = html;
    document.getElementById('confirm-error').style.display = 'none';
    document.getElementById('confirm-overlay').style.display = 'flex';
    _confirmCallback = onConfirm;

    // 绑定确认按钮
    const submitBtn = document.getElementById('confirm-submit-btn');
    submitBtn.onclick = async function() {
        // 收集字段值
        const values = {};
        for (const f of fields) {
            const el = document.getElementById('confirm-field-' + f.id);
            values[f.id] = el.value.trim();
        }
        // 回调
        try {
            setButtonLoading(submitBtn, true);
            document.getElementById('confirm-error').style.display = 'none';
            await onConfirm(values);
            closeConfirmDialog();
        } catch (e) {
            document.getElementById('confirm-error').textContent = e.message || '操作失败';
            document.getElementById('confirm-error').style.display = 'block';
            setButtonLoading(submitBtn, false);
        }
    };

    // 回车快捷提交
    container.querySelectorAll('input').forEach(input => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitBtn.click();
        });
    });

    // 自动聚焦第一个输入框
    const firstInput = container.querySelector('input');
    if (firstInput) firstInput.focus();
}

/** 关闭确认弹窗 */
function closeConfirmDialog() {
    document.getElementById('confirm-overlay').style.display = 'none';
    _confirmCallback = null;
}

/** 修改用户名 */
function onEditUsername() {
    const current = currentSettings && currentSettings.account ? currentSettings.account.username : '';
    openConfirmDialog('修改用户名', [
        { id: 'new_username', label: '新用户名', type: 'text', placeholder: '请输入新用户名（至少3位）' },
        { id: 'password', label: '当前密码', type: 'password', placeholder: '请输入当前密码以确认' }
    ], async function(values) {
        if (!values.new_username) throw new Error('请输入新用户名');
        if (values.new_username.length < 3) throw new Error('用户名至少需要3位');
        if (!values.password) throw new Error('请输入当前密码');
        await api.updateUsername(values.password, values.new_username);
        await loadSettings();
    });
}

/** 修改邮箱 */
function onEditEmail() {
    const current = currentSettings && currentSettings.account ? currentSettings.account.email : '';
    openConfirmDialog('修改邮箱', [
        { id: 'new_email', label: '新邮箱', type: 'email', placeholder: '请输入新邮箱地址' },
        { id: 'password', label: '当前密码', type: 'password', placeholder: '请输入当前密码以确认' }
    ], async function(values) {
        if (!values.new_email) throw new Error('请输入新邮箱');
        if (!values.password) throw new Error('请输入当前密码');
        await api.updateEmail(values.password, values.new_email);
        await loadSettings();
    });
}

/** 修改密码 */
function onEditPassword() {
    openConfirmDialog('修改密码', [
        { id: 'password', label: '当前密码', type: 'password', placeholder: '请输入当前密码' },
        { id: 'new_password', label: '新密码', type: 'password', placeholder: '请输入新密码（至少6位）' },
        { id: 'confirm_password', label: '确认新密码', type: 'password', placeholder: '请再次输入新密码' }
    ], async function(values) {
        if (!values.password) throw new Error('请输入当前密码');
        if (!values.new_password) throw new Error('请输入新密码');
        if (values.new_password.length < 6) throw new Error('新密码至少需要6位');
        if (values.new_password !== values.confirm_password) throw new Error('两次输入的新密码不一致');
        await api.updatePassword(values.password, values.new_password);
    });
}

// 初始化：加载用户信息后获取设置
loadSidebar('settings');
initPage().then(() => loadSettings());
</script>
</body>
</html>
