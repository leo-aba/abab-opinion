<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频管理 — AI Video Opinion Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar-container"></div>

<!-- Main Content -->
<main class="main-content">
    <!-- Header -->
    <header class="top-header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" title="菜单">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div>
                <h2>视频管理</h2>
                <div class="greeting">管理已添加的分析视频</div>
            </div>
        </div>
        <div class="header-stats">
            <div class="header-stat">
                <div class="val" id="stat-today-comments">—</div>
                <div class="lbl">今日评论</div>
            </div>
            <div class="header-stat">
                <div class="val" id="stat-new-videos">—</div>
                <div class="lbl">新增视频</div>
            </div>
            <div class="header-stat">
                <div class="val" id="stat-completion">—</div>
                <div class="lbl">分析完成</div>
            </div>
            <div class="header-stat">
                <div class="val" id="stat-hot-topic">—</div>
                <div class="lbl">最近热点</div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <div class="page-content active" id="content-videos">
        <div class="video-grid" id="video-grid"></div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
/** 加载视频列表网格 */
async function loadVideos() {
    const grid = document.getElementById('video-grid');

    try {
        showLoading('video-grid');
        const data = await api.getVideos(1, 20);

        if (!data || !data.items || data.items.length === 0) {
            showEmpty('video-grid', '暂无视频', '🎬');
            return;
        }

        let html = '';
        for (const v of data.items) {
            const platformBadge = getPlatformBadge(v.platform);
            const statusLabel = getStatusLabel(v.status);
            const statusClass = getStatusClass(v.status);
            const coverTitle = v.title || v.video_id;
            const subtitle = v.last_analysis_date
                ? '最后分析: ' + v.last_analysis_date
                : '';

            html += `
            <div class="video-card" onclick="window.location.href='results.html?task_id=${encodeURIComponent(v.video_id)}'">
                <div class="video-card-cover" style="background:var(--cover-bg, #111);overflow:hidden;">
                    ${v.cover_url ? '<img src="' + escapeHtml(v.cover_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;">' : '<span style="color:var(--text-secondary);font-size:13px;">' + escapeHtml(coverTitle) + '</span>'}
                    ${platformBadge}
                    ${v.status === 'tracking' ? '<span class="tracking-status-row" style="position:absolute;top:10px;right:10px;"><span class="tracking-live-dot"></span>追踪中</span>' : ''}
                </div>
                <div class="video-card-body">
                    <h4>${escapeHtml(v.title)}</h4>
                    <div class="video-card-meta">
                        <span>${escapeHtml(v.author)}</span>
                        <span>${(v.comment_count || 0).toLocaleString()} 评论</span>
                    </div>
                    ${subtitle || v.new_comments_since_tracking ? '<div class="video-card-meta" style="margin-top:4px;"><span>' + escapeHtml(v.publish_date || '') + '</span><span>' + (v.new_comments_since_tracking ? '追踪中 · 新增+' + v.new_comments_since_tracking : escapeHtml(subtitle)) + '</span></div>' : ''}
                    <span class="video-card-status ${statusClass}">${statusLabel.text}</span>
                </div>
            </div>`;
        }
        grid.innerHTML = html;
    } catch (e) {
        console.error('loadVideos error:', e);
        showError('video-grid', '加载视频列表失败，请重试');
    }
}

/** 平台枚举 → 平台徽章 HTML */
function getPlatformBadge(platform) {
    if (platform === 'bilibili') return '<span class="platform-badge bilibili">B站</span>';
    if (platform === 'douyin') return '<span class="platform-badge douyin">抖音</span>';
    return '';
}

/** 分析状态 → { text, cls } */
function getStatusLabel(status) {
    switch (status) {
        case 'tracking': return { text: '实时追踪中', cls: 'tracking' };
        case 'analyzed': return { text: '已分析', cls: 'analyzed' };
        case 'analyzing': return { text: '分析中', cls: 'pending' };
        case 'pending': return { text: '待分析', cls: 'pending' };
        default: return { text: status || '—', cls: '' };
    }
}

/** 分析状态 → CSS 类名 */
function getStatusClass(status) {
    switch (status) {
        case 'tracking': return 'tracking';
        case 'analyzed': return 'analyzed';
        case 'analyzing': return 'pending';
        case 'pending': return 'pending';
        default: return '';
    }
}

/** 防 XSS 的 HTML 转义 */
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 初始化：加载用户信息后获取视频列表
loadSidebar('videos');
initPage().then(() => loadVideos());
</script>
</body>
</html>
